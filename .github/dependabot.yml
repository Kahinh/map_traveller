# Mises à jour proposées chaque semaine : une PR groupée par écosystème pour les versions mineures
# et correctives ; chaque version majeure arrive dans sa propre PR, à examiner à part. Rien n'est
# fusionné automatiquement : chaque PR passe par le build Windows (.github/workflows/windows.yml).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # typescript-eslint 8.x exige typescript < 6.1 : la majeure suivante casse le lint (PR #26
      # en échec). À lever quand typescript-eslint la prendra en charge.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
