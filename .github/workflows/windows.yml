name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Lecture seule par défaut ; l'écriture n'est accordée qu'au job qui publie (ci-dessous).
permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

# Actions épinglées par SHA de commit (le tag peut être déplacé, pas le SHA) ; Dependabot
# (.github/dependabot.yml) propose les mises à jour.
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    # Un seul job : il contrôle, construit puis publie sur tag. `contents: write` ne sert qu'à
    # l'étape « Publier la release » (tags v*), mais ne peut pas être restreint à une étape.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Aucune étape ne pousse : le jeton n'a pas à rester dans .git/config pour les suivantes.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # Même version que src-tauri/rust-toolchain.toml (à changer ensemble).
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: 1.97.0
          components: clippy, rustfmt

      # Cache écrit seulement par main : les PR et les tags le lisent sans le polluer.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Vérifier que le tag correspond à la version (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: node scripts/version.mjs --check "${GITHUB_REF_NAME#v}"

      - name: Installer les dépendances
        run: npm ci

      - name: Typecheck, lint, tests (règles de copie, Farm, catalogue)
        run: npm run check

      - name: Format Rust
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests Rust (stockage, images, raccourcis)
        working-directory: src-tauri
        run: cargo test --locked

      # main, pull requests, workflow_dispatch : build de contrôle NON signé, sans aucun secret.
      # Le front est construit par `beforeBuildCommand` (vite build seul : typecheck fait plus haut).
      - name: Build Tauri (installateur NSIS)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npx tauri build --bundles nsis -- --locked

      # Tags vX.Y.Z uniquement : build signé pour les mises à jour (installateur + .sig).
      # La surcharge active createUpdaterArtifacts ; les secrets ne sont exposés qu'à cette étape,
      # en variables d'environnement lues par la CLI Tauri. Ne jamais les afficher.
      - name: Build Tauri signé (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles nsis --config src-tauri/tauri.release.conf.json -- --locked

      # JS chargé à l'ouverture de chaque page (dist/ vient d'être construit par beforeBuildCommand).
      - name: Budget JS des pages
        run: node scripts/bundle-budget.mjs

      - name: Publier l'installateur (artefact)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MapTraveller-setup-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # Vérifie la signature avec la clé publique de tauri.conf.json, puis rassemble dans release/
      # les trois fichiers à publier : installateur, signature, latest.json.
      - name: Préparer les fichiers de mise à jour (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: node scripts/make-latest-json.mjs prepare --tag "${GITHUB_REF_NAME}"

      # Sur un tag vX.Y.Z : publie une Release GitHub avec le .exe directement téléchargeable,
      # sa signature et l'index latest.json lu par l'application.
      - name: Publier la release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: Map Traveller ${{ github.ref_name }}
          draft: false
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/*_x64-setup.exe
            release/*_x64-setup.exe.sig
            release/latest.json

      # Relit latest.json depuis la Release du tag et depuis l'adresse interrogée par l'application,
      # contrôle version, adresse et signature, et télécharge l'installateur publié.
      - name: Contrôler la release publiée (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: node scripts/make-latest-json.mjs verify --tag "${GITHUB_REF_NAME}"
