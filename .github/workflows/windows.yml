name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # nécessaire uniquement pour la release brouillon sur tag v*

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Vérifier que le tag correspond à la version (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: node scripts/version.mjs --check "${GITHUB_REF_NAME#v}"

      - name: Installer les dépendances
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests (règles de copie, Farm, catalogue)
        run: npm test

      - name: Tests Rust (stockage)
        working-directory: src-tauri
        run: cargo test

      - name: Build Tauri (installateur NSIS)
        run: npx tauri build --bundles nsis

      - name: Publier l'installateur (artefact)
        uses: actions/upload-artifact@v7
        with:
          name: MapTraveller-setup-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # Sur un tag vX.Y.Z : publie une Release GitHub avec le .exe directement téléchargeable.
      - name: Publier la release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: Map Traveller ${{ github.ref_name }}
          draft: false
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: src-tauri/target/release/bundle/nsis/*.exe
