name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # nécessaire uniquement pour publier la Release sur tag v*

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Vérifier que le tag correspond à la version (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: node scripts/version.mjs --check "${GITHUB_REF_NAME#v}"

      - name: Installer les dépendances
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests (règles de copie, Farm, catalogue)
        run: npm test

      - name: Tests Rust (stockage)
        working-directory: src-tauri
        run: cargo test

      # main, pull requests, workflow_dispatch : build de contrôle NON signé, sans aucun secret.
      - name: Build Tauri (installateur NSIS)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npx tauri build --bundles nsis

      # Tags vX.Y.Z uniquement : build signé pour les mises à jour (installateur + .sig).
      # La surcharge active createUpdaterArtifacts ; les secrets ne sont exposés qu'à cette étape,
      # en variables d'environnement lues par la CLI Tauri. Ne jamais les afficher.
      - name: Build Tauri signé (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles nsis --config src-tauri/tauri.release.conf.json

      - name: Publier l'installateur (artefact)
        uses: actions/upload-artifact@v7
        with:
          name: MapTraveller-setup-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # Vérifie la signature avec la clé publique de tauri.conf.json, puis rassemble dans release/
      # les trois fichiers à publier : installateur, signature, latest.json.
      - name: Préparer les fichiers de mise à jour (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: node scripts/make-latest-json.mjs prepare --tag "${GITHUB_REF_NAME}"

      # Sur un tag vX.Y.Z : publie une Release GitHub avec le .exe directement téléchargeable,
      # sa signature et l'index latest.json lu par l'application.
      - name: Publier la release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: Map Traveller ${{ github.ref_name }}
          draft: false
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/*_x64-setup.exe
            release/*_x64-setup.exe.sig
            release/latest.json

      # Relit latest.json depuis la Release du tag et depuis l'adresse interrogée par l'application,
      # contrôle version, adresse et signature, et télécharge l'installateur publié.
      - name: Contrôler la release publiée (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: node scripts/make-latest-json.mjs verify --tag "${GITHUB_REF_NAME}"
