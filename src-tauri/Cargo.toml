[package]
name = "map-traveller"
version = "1.1.0"
description = "Map Traveller — copie de commandes /travel"
edition = "2021"
publish = false

# Bibliothèque liée au binaire `MapTraveller` (et aux tests) ; application Windows seulement :
# ni `staticlib` ni `cdylib`, qui ne servent qu'aux cibles mobiles.
[lib]
name = "map_traveller_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
serde_json = "1"
tauri-plugin-global-shortcut = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
